[package]
name = "codex-discord-bridge"
version = "0.1.0"
edition = "2024"


[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", features = ["builder", "client", "gateway", "http", "model", "cache"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.2.1"
async-trait = "0.1"
dotenvy = "0.15.7"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util", "macros"] }
tokio-tungstenite = "0.28"
[lib]
path = "src/lib.rs"
